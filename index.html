<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C&C Ingeniería y Proyectos</title>
  <!-- Fuentes y librerías -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      color: #333;
      scroll-behavior: smooth;
      background: #f9f9fb;
    }
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: #1c2a39;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 40px;
      z-index: 1000;
    }
    header img {
      height: 50px;
    }
    nav {
      display: flex;
      justify-content: center;
      flex: 1;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
    }
    nav a:hover {
      color: #4da6ff;
    }
    section {
      padding: 100px 40px;
      min-height: 100vh;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease-out;
    }
    section.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #inicio {
      background: url("inicio.png") no-repeat center center/cover;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #inicio h1 {
      font-size: 3em;
      margin-bottom: 20px;
      font-family: 'Poppins', sans-serif;
    }
    .btn {
      background: #4da6ff;
      color: white;
      padding: 12px 25px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      background: #1c2a39;
    }
    #quienes {
      background: white;
      color: #1c2a39;
      text-align: center;
    }
    #quienes img {
      width: 100%;
      border-radius: 10px;
      margin-top: 20px;
    }
    #portafolio {
      background: url("portafolio.png") no-repeat center center/cover;
      background-size: cover;
      color: #1c2a39;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    .card img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    #ubicacion {
      background: url("ubicacion.png") no-repeat center center/cover;
      background-size: cover;
      color: #1c2a39;
      text-align: center;
    }
    #contacto {
      background: url("contacto.png") no-repeat center center/cover;
      background-size: cover;
      color: #1c2a39;
      text-align: center;
    }
    .social {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    .social div {
      margin: 0 20px;
      text-align: center;
    }
    .social i {
      font-size: 2em;
      color
